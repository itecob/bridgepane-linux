name: Bug report
description: Report a reproducible problem without including private data.
body:
  - type: markdown
    attributes:
      value: Do not include tokens, cookies, private prompts, account identifiers, or proprietary source.
  - type: input
    id: version
    attributes:
      label: Application version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux environment
      description: Distribution, version, desktop environment, X11/Wayland, architecture, and package type.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
