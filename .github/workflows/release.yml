name: Release Linux packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run verify
      - name: Build native packages
        run: |
          npm run build
          npx electron-builder --linux deb --${{ matrix.arch }}
          npx electron-builder --linux rpm --${{ matrix.arch }}
      - name: Create SBOM and checksums
        run: |
          npm sbom --sbom-format cyclonedx > release/sbom-${{ matrix.arch }}.cdx.json
          cd release
          sha256sum *.deb *.rpm *.json > SHA256SUMS-${{ matrix.arch }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.deb
            release/*.rpm
      - uses: actions/attest-sbom@v2
        with:
          subject-path: |
            release/*.deb
            release/*.rpm
          sbom-path: release/sbom-${{ matrix.arch }}.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.rpm
            release/*.json
            release/SHA256SUMS-*
          if-no-files-found: error

  deb-install-smoke:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release
      - name: Install Debian package in a clean runner
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ./release/*.deb
      - name: Verify sandboxed desktop startup
        run: |
          set +e
          timeout 12 xvfb-run -a codex-desktop
          status=$?
          test "$status" -eq 124

  rpm-install-smoke:
    needs: packages
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release
      - name: Install and query RPM package
        run: |
          dnf install -y ./release/*.rpm
          rpm -q --info codex-desktop-linux


  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages, deb-install-smoke, rpm-install-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --verify-tag --prerelease --generate-notes
